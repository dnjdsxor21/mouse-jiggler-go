version: 2
project_name: mouse-jiggler

builds:
  - id: mouse-jiggler
    main: ./cmd/mouse-jiggler
    binary: mouse-jiggler
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids:
      - mouse-jiggler
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - name: mouse-jiggler
    ids:
      - default
    repository:
      owner: dnjdsxor21
      name: homebrew-tap
      branch: main
    homepage: https://github.com/dnjdsxor21/mouse-jiggler-go
    description: Moves the mouse pointer periodically without clicking
    license: MIT
    install: |
      bin.install "mouse-jiggler"
    test: |
      system "#{bin}/mouse-jiggler", "--version"
    caveats: |
      mouse-jiggler needs Accessibility access before it can move the pointer.
      Open System Settings > Privacy & Security > Accessibility, add the
      installed executable, enable it, and run mouse-jiggler again.
